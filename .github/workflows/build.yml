name: Build Serial DLL

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile DLL via Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Build Code
      shell: cmd
      run: |
        cl.exe /LD /EHsc dllmain.cpp /Fe:adb_serial_monitor.dll /link /INCREMENTAL:NO

    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Serial-DLL
        path: adb_serial_monitor.dll
