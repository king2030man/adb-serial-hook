name: Build Lua Hook DLL

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure MSVC for x86 (32-bit)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Compile Lua Proxy DLL
      shell: cmd
      run: |
        cl.exe /LD /EHsc dllmain.cpp /Fe:lua5.1.dll /link /INCREMENTAL:NO /MACHINE:X86

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: Lua-Proxy-DLL
        path: lua5.1.dll
